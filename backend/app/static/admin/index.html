<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>ChildSafe Admin</title>

    <link
        rel="stylesheet"
        href="/static/admin/admin.css"
    >
</head>

<body>
    <div id="app">

        <section id="login-view" class="view">
            <div class="login-card">
                <h1>ChildSafe</h1>
                <p>Administrative Review Portal</p>

                <form id="login-form">
                    <label>
                        Username
                        <input
                            id="username"
                            type="text"
                            autocomplete="username"
                            required
                        >
                    </label>

                    <label>
                        Password
                        <input
                            id="password"
                            type="password"
                            autocomplete="current-password"
                            required
                        >
                    </label>

                    <button type="submit">
                        Sign in
                    </button>

                    <p
                        id="login-error"
                        class="error-message"
                    ></p>
                </form>
            </div>
        </section>

        <section
            id="dashboard-view"
            class="view hidden"
        >
            <header class="topbar">
                <div>
                    <h1>ChildSafe Admin</h1>
                    <p id="current-user"></p>
                </div>

                <div class="topbar-actions">
                    <select id="period-filter">
                        <option value="7">7 days</option>
                        <option value="30" selected>
                            30 days
                        </option>
                        <option value="90">90 days</option>
                    </select>

                    <button
                        id="refresh-button"
                        type="button"
                    >
                        Refresh
                    </button>

                    <button
                        id="logout-button"
                        type="button"
                        class="secondary-button"
                    >
                        Logout
                    </button>
                </div>
            </header>

            <main class="dashboard">

                <section class="metrics-grid">
                    <article class="metric-card">
                        <span>Total reports</span>
                        <strong id="metric-total">
                            0
                        </strong>
                    </article>

                    <article class="metric-card">
                        <span>Pending</span>
                        <strong id="metric-pending">
                            0
                        </strong>
                    </article>

                    <article class="metric-card">
                        <span>Urgent pending</span>
                        <strong id="metric-urgent">
                            0
                        </strong>
                    </article>

                    <article class="metric-card">
                        <span>Confirmed</span>
                        <strong id="metric-confirmed">
                            0
                        </strong>
                    </article>

                    <article class="metric-card">
                        <span>Escalated</span>
                        <strong id="metric-escalated">
                            0
                        </strong>
                    </article>

                    <article class="metric-card">
                        <span>Confirmation rate</span>
                        <strong id="metric-confirmation-rate">
                            0%
                        </strong>
                    </article>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <h2>Risk distribution</h2>
                    </div>

                    <div id="risk-distribution">
                        <div class="risk-row">
                            <span>Low</span>
                            <strong id="risk-low">0</strong>
                        </div>

                        <div class="risk-row">
                            <span>Medium</span>
                            <strong id="risk-medium">0</strong>
                        </div>

                        <div class="risk-row">
                            <span>High</span>
                            <strong id="risk-high">0</strong>
                        </div>

                        <div class="risk-row">
                            <span>Critical</span>
                            <strong id="risk-critical">0</strong>
                        </div>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <h2>Report trend</h2>
                    </div>

                    <div
                        id="report-trend"
                        class="table-wrapper"
                    ></div>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <h2>Human review trend</h2>
                    </div>

                    <div
                        id="review-trend"
                        class="table-wrapper"
                    ></div>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <h2>Urgent review queue</h2>
                    </div>

                    <div
                        id="review-queue"
                        class="table-wrapper"
                    ></div>
                </section>

                <section
                    id="reviewers-panel"
                    class="panel"
                >
                    <div class="panel-header">
                        <h2>Reviewers</h2>
                    </div>

                    <div
                        id="reviewers-list"
                        class="table-wrapper"
                    ></div>
                </section>

                <section
                    id="audit-panel"
                    class="panel"
                >
                    <div class="panel-header">
                        <h2>Administrative audit log</h2>
                    </div>

                    <div
                        id="audit-log"
                        class="table-wrapper"
                    ></div>
                </section>

            </main>
        </section>

    </div>

    <script src="/static/admin/admin.js"></script>
</body>
</html>
